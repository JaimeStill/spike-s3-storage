services:
  seaweedfs:
    # The image and flags of the s3 module's acceptance harness, scripts/seaweedfs.sh: `weed mini`
    # with only its S3 gateway published. The gateway's admin identity is the access key admin
    # with the secret secret, read from AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY at startup.
    # -s3.autoCreateBucket=false turns off SeaweedFS's default of creating a missing bucket on an
    # admin's upload, so a write to a missing bucket fails as it does on AWS; the store's Start
    # creates the bucket.
    image: chrislusf/seaweedfs:4.48
    command: mini -dir=/data -s3.autoCreateBucket=false
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
    ports:
      # 8334 by default so the stack coexists with the acceptance harness on 8333;
      # `mise run app:integration` sets 8335 for its isolated project.
      - "127.0.0.1:${SEAWEEDFS_S3_PORT:-8334}:8333"
    volumes:
      - blobfs-seaweedfs:/data
    healthcheck:
      # Healthy once a request signed with the admin identity lists the buckets, which proves
      # the gateway, its filer, and the credential together: the gateway answers unsigned
      # requests before the credential is loaded. The image's curl signs it.
      test:
        [
          "CMD-SHELL",
          "curl --silent --fail --output /dev/null --aws-sigv4 aws:amz:us-east-1:s3 --user admin:secret http://127.0.0.1:8333/",
        ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  blobfs-seaweedfs:
