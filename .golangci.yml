# golangci-lint v2 configuration, run per module by `mise run check`.
version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused),
  # plus testpackage, which keeps tests black-box. Its skip regexp is
  # narrowed to export_test.go, so every other test file must be in the
  # external test package; export_test.go may only export a clock or probe
  # hook the API cannot reach deterministically.
  default: standard
  enable:
    - testpackage
  settings:
    testpackage:
      skip-regexp: 'export_test\.go'
