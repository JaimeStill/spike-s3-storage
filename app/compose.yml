# The local stack. `mise run up` runs it as the development project, spike-cli-architecture, on
# the default ports; `mise run integration` runs it as its own project,
# spike-cli-architecture-integration, on 5437 and 10011, and tears it down with its volumes when
# the suite ends. The project name scopes the containers and volumes, and the host ports keep the
# two projects, and spike-blobfs's stack, apart, so all can run at once.
name: spike-cli-architecture

include:
  - compose/postgres.yml
  - compose/azurite.yml
